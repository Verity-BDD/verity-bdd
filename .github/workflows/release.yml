name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      library_sha:
        description: Exact main-branch commit with a successful push CI run
        required: true
        type: string

permissions: {}

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  build-release:
    name: Validate provenance and prepare release
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      library_sha: ${{ steps.provenance.outputs.library_sha }}
      version: ${{ steps.prepare.outputs.version }}
      release_body_b64: ${{ steps.prepare.outputs.release_body_b64 }}
      publish_script_sha256: ${{ steps.prepare.outputs.publish_script_sha256 }}

    steps:
      - name: Select exact candidate SHA
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.library_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            library_sha="$WORKFLOW_RUN_SHA"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            library_sha="$MANUAL_SHA"
          else
            echo "unsupported release event: $EVENT_NAME" >&2
            exit 1
          fi
          [[ "$library_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release SHA must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          }
          echo "library_sha=$library_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.source.outputs.library_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify checkout identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.source.outputs.library_sha }}"
          test -z "$(git status --porcelain)"

      - name: Prove successful push CI provenance
        id: provenance
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          LIBRARY_SHA: ${{ steps.source.outputs.library_sha }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/release/verify_provenance.py

      - name: Prepare deterministic release metadata
        id: prepare
        env:
          LIBRARY_SHA: ${{ steps.provenance.outputs.library_sha }}
        run: python3 .github/scripts/release/prepare_release.py

  publish-release:
    name: Publish exact release
    needs: build-release
    if: needs.build-release.outputs.version != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Reconcile exact tag and GitHub Release
        env:
          API_URL: ${{ github.api_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LIBRARY_SHA: ${{ needs.build-release.outputs.library_sha }}
          PUBLISH_SCRIPT_SHA256: ${{ needs.build-release.outputs.publish_script_sha256 }}
          RELEASE_BODY_B64: ${{ needs.build-release.outputs.release_body_b64 }}
          RELEASE_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build-release.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT

          printf '%s' "$RELEASE_TOKEN" > "$temp_dir/token"
          unset RELEASE_TOKEN

          script_url="https://raw.githubusercontent.com/${REPOSITORY}/${LIBRARY_SHA}/.github/scripts/release/publish_release.py"
          env -i HOME="$temp_dir" PATH=/usr/bin:/bin \
            /usr/bin/curl -q --fail --silent --show-error \
            --proto '=https' --tlsv1.2 --max-redirs 0 \
            --output "$temp_dir/publish_release.py" "$script_url"
          printf '%s  %s\n' "$PUBLISH_SCRIPT_SHA256" "$temp_dir/publish_release.py" \
            > "$temp_dir/publish_release.py.sha256"
          sha256sum --check "$temp_dir/publish_release.py.sha256"

          env -i HOME="$temp_dir" PATH=/usr/bin:/bin \
            python3 "$temp_dir/publish_release.py" \
              --api-url "$API_URL" \
              --default-branch "$DEFAULT_BRANCH" \
              --library-sha "$LIBRARY_SHA" \
              --release-body-b64 "$RELEASE_BODY_B64" \
              --repository "$REPOSITORY" \
              --token-file "$temp_dir/token" \
              --version "$VERSION"
